  --bg: #2a2320; --surface: #342c28; --band: #2f2723; --ink: #efe7d8; --muted: #bdb1a1; --line: #4a4039;
  --cobre: #c98d55; --cobre-ink: #dba46b; --rosa: #c9a199; --lila: #b3aac0;

}

* { box-sizing: border-box; }

  background: var(--bg); color: var(--ink);

}

.wrap { max-width: 1040px; margin: 0 auto; }
.eyebrow {
  font-family: var(--font-display); font-weight: 400; font-size: 12.5px;
  letter-spacing: .3em; text-transform: uppercase; color: var(--cobre-ink);
}
.mark { display: inline-block; aspect-ratio: 240 / 241; background: currentColor;
  -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; }

/* Botones */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 0 30px; border-radius: 999px; border: 1px solid var(--btn-bg);
  font-family: var(--font-display); font-weight: 400; font-size: 14px; letter-spacing: .16em; text-transform: uppercase;
  text-decoration: none; background: var(--btn-bg); color: var(--btn-ink); text-align: center;
  transition: transform .15s ease, opacity .15s ease;
}

/* Aviso de vista previa (se quita al conectar el número) */

        step(3, "Pide y paga por WhatsApp", "Te llega el pedido escrito. Pagas por Nequi o Bre-B.") +
        '</div></div></div></section>' +

      '<section class="block"><div class="comm"><div class="eyebrow">Comunidad Mujeres de Luz</div><h2>No estás sola en esto</h2>' +
      '<p>Tenemos una comunidad de mujeres a las que acompañamos todos los días. Si quieres hacer parte, entra al grupo de WhatsApp o escríbenos.</p>' +
      '<ul><li>Te enviamos afirmaciones todos los días.</li><li>Meditaciones en vivo, gratis.</li><li>Herramientas para el manejo de la ansiedad y el estrés.</li><li>Espacios exclusivos con nuestras invitadas especiales.</li></ul>' +
      '<div class="cta-row"><a class="btn" id="waComm" href="' + communityHref() + '" target="_blank" rel="noopener">' + WA + 'Quiero pertenecer a la comunidad</a></div></div></section>' +

      '<section class="block"><div class="sec-head"><div class="eyebrow">Promoción</div><h2>Promoción de temporada: <del>$83.000</del> por ahora en $63.000</h2><p>Entre más llevas, menos pagas. Con 3 o más velitas, el envío es gratis.</p></div>' +
      '<div class="tiers">' +
        '<div class="tier"><span class="n">1 velita</span><b>$63.000</b><small>+ envío</small></div>' +
        '<div class="tier"><span class="n">2 velitas</span><b>$112.000</b><small>+ envío</small></div>' +
        '<div class="tier best"><span class="n">3 velitas</span><b>$145.000</b><small>envío gratis</small></div>' +
        '<div class="tier best"><span class="n">4 velitas</span><b>$180.000</b><small>envío gratis</small></div>' +
      '</div></section>' +

      '<section class="block"><div class="sec-head"><div class="eyebrow">Pago y entrega</div><h2>Fácil y sin vueltas</h2></div>' +
      '<div class="pay"><div><h3>Nequi o Bre-B</h3><p>Pagas en segundos, en el mismo chat de WhatsApp.</p></div>' +
      '<div><h3>Estamos en Bogotá</h3><p>Prometemos entrega al día siguiente en Bogotá. Enviamos a todo el país en 2 a 3 días hábiles.</p></div>' +
      '<div><h3>Envío según tu ubicación</h3><p>El valor depende de dónde estés. Te lo decimos al finalizar tu pedido, por WhatsApp.</p></div></div></section>' +

      '<section class="block"><div class="sec-head"><div class="eyebrow">Mujeres de Luz</div><h2>Así se ve en tu casa</h2></div>' +
      '<div class="gallery"><img src="q-sonrie.jpg" alt="Un momento de pausa con la velita MDL" loading="lazy"><img src="q-grupo.jpg" alt="Velitas MDL listas para encender" loading="lazy"><img src="p6.jpg" alt="Velitas MDL con tapa dorada" loading="lazy"></div></section>' +

      '<section class="block"><div class="sec-head"><div class="eyebrow">Preguntas</div><h2>Lo que más nos preguntan</h2></div>' + faq + '</section>' +

      '<section class="closing"><span class="mark"></span><h2>No regales una velita, regala un momento.</h2>' +
      '<div class="cta-row" style="justify-content:center"><a class="btn" href="#test">Descubre tu ritual</a><a class="btn ghost" href="' + communityHref() + '" target="_blank" rel="noopener">Quiero pertenecer a la comunidad</a></div><p class="slogan" style="margin-top:18px">Entrenamos tu mente para que esté a tu favor.</p><div class="tag">brillamos con luz propia</div></section>' +
      '</main>' +
      '<footer class="foot wrap">'+ "Entrenamos tu mente para que esté a tu favor." + '<br>Mujeres de Luz · ' + INSTAGRAM + ' · WhatsApp +57 316 888 3415 · Bogotá, Colombia</footer>' +
      '<div class="dock"><a class="btn" href="#test">Descubre tu ritual</a><a class="btn ghost" id="waDock" href="' + waHref(generic) + '" target="_blank" rel="noopener">' + WA + 'WhatsApp</a></div>';

    app.querySelectorAll("[data-pick]").forEach(function (b) {
      b.addEventListener("click", function () {
        st.ritual = b.getAttribute("data-pick"); st.mode = "mi"; st.q = QUESTIONS.length; st.answers = [];
        location.hash = "#test";
      });
    });
  }
  function item(t, d) {
    return '<li><span class="dot">' + STAR + '</span><div><b>' + t + '</b><span>' + d + '</span></div></li>';
  }
  function step(n, t, d) {
    return '<div class="s"><div class="n">' + n + '</div><div><h3>' + t + '</h3><p>' + d + '</p></div></div>';
  }

  /* ====== TEST ====== */
  function computeRitual() {
    var score = { yo2027: 0, calma: 0 };
    QUESTIONS.forEach(function (q, i) {
      if (q.mode) return;
      var a = st.answers[i]; if (!a) return;
      score[a]++;
    });
    if (score.yo2027 !== score.calma) return score.yo2027 > score.calma ? "yo2027" : "calma";
    if (st.mode === "compartir") return "yo2027";
    return st.answers[0] || "calma";
  }

  function testShell(inner) {
    document.body.classList.remove("is-landing");
    app.innerHTML = previewBar() + header(true) + '<main class="test">' + inner + '</main>';
  }

  function renderQuestion() {
    var q = QUESTIONS[st.q];
    var sel = st.answers[st.q];
    var opts = q.o.map(function (o, i) {
      return '<button class="opt" data-i="' + i + '" aria-pressed="' + (sel === o[1]) + '"><span class="dot"></span><span>' + o[0] + '</span></button>';
    }).join("");
    testShell(
      '<div class="test-top"><div style="flex:1"><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="' + (st.q + 1) + '"><i style="width:' + ((st.q + 1) / 5 * 100) + '%"></i></div>' +
      '<div class="q-count">Pregunta ' + (st.q + 1) + ' de 5 · gratis · 2 minutos</div></div></div>' +
      '<div class="q" aria-live="polite"><div class="eyebrow">Descubre tu ritual</div><h1>' + q.t + '</h1><p class="sub">' + q.s + '</p><div class="opts">' + opts + '</div>' +
      '<div class="q-nav">' + (st.q > 0 ? '<button class="link" id="back">Volver</button>' : '<span></span>') + '</div></div>'
    );
    app.querySelectorAll(".opt").forEach(function (b) {
      b.addEventListener("click", function () {
        var v = q.o[+b.getAttribute("data-i")][1];
        st.answers[st.q] = v;
        if (q.mode) st.mode = v;
        if (st.q < QUESTIONS.length - 1) { st.q++; renderQuestion(); window.scrollTo(0, 0); }
        else { st.ritual = computeRitual(); st.q = QUESTIONS.length; renderResult(); window.scrollTo(0, 0); }
      });
    });
    var back = document.getElementById("back");
    if (back) back.addEventListener("click", function () { st.q--; renderQuestion(); });
  }

  var MODE_COPY = {
    mi: { lab: "Tu intención", ph: "Escribe lo que quieres recordar cuando enciendas tu vela", card: "Tu intención" },
    compartir: { lab: "Tu mensaje para ella", ph: "Un mensaje para compartir este momento con ella", card: "Para compartir" },
    regalo: { lab: "Tu dedicatoria", ph: "Escribe lo que quieres decirle a quien la recibe", card: "Para ti" }
  };
  var MODE_NAMES = { mi: "Para mí", compartir: "Para compartir", regalo: "Para regalar" };

  function renderResult() {
    var r = RITUALS[st.ritual];
    var swap = ORDER.map(function (k) {
      return '<button class="chip" data-swap="' + k + '" aria-pressed="' + (k === st.ritual) + '">' + RITUALS[k].name + '</button>';
    }).join("");
    var seg = ["mi", "compartir", "regalo"].map(function (m) {
      return '<button class="chip" data-mode="' + m + '" aria-pressed="' + (m === st.mode) + '">' + MODE_NAMES[m] + '</button>';
    }).join("");

    testShell(
      '<div class="res r-' + r.key + '">' +
      '<div class="test-top"><div class="q-count">Tu resultado</div></div>' +
      '<div class="orb-lg">' + ICONS[r.key] + '</div>' +
      '<div class="eyebrow">' + r.el + ' · ' + r.emo + '</div>' +
      '<h1>Tu ritual: ' + r.name + '</h1>' +
      '<p class="hook">' + r.hook + '</p>' + '<p class="slogan">'+"Entrenamos tu mente para que esté a tu favor."+'</p>' +
      '<p class="desc">' + r.short + '</p>' +
      '<div class="swap"><span>¿No es el tuyo?</span>' + swap + '</div>' +
      '<div class="eyebrow">Aroma · ' + r.aroma + '</div><p class="desc" style="margin-top:8px">' + r.aromaTxt + '</p>' +
      '<div class="take-t">Lo que te llevas</div>' +
      '<ol class="ritual-steps">' + r.take.map(function (s, i) { return '<li><i>' + (i + 1) + '</i><span>' + s + '</span></li>'; }).join("") + '</ol>' +
      '<p class="sorpresa" style="margin:-14px 0 28px">Tu ritual paso a paso lo descubres al abrir tu caja.</p>' +
      '<div class="form">' +
        '<h2>Personaliza tu caja</h2>' +
        '<div class="field"><span class="lbl">¿Para quién es?</span><div class="seg" id="seg">' + seg + '</div></div>' +
        '<div class="field"><label for="f-name">Tu nombre</label><input type="text" id="f-name" autocomplete="given-name" maxlength="40" placeholder="Cómo te llamas"><div class="err" id="err-name" hidden>Escribe tu nombre para armar el pedido.</div></div>' +
        '<div class="field" id="row-to"><label for="f-to">Nombre de ella (opcional)</label><input type="text" id="f-to" maxlength="40" placeholder="Para quién es la caja"></div>' +
        '<div class="field"><label for="f-msg" id="lab-msg"></label><textarea id="f-msg" maxlength="120"></textarea><div class="count" id="count">0 / 120</div></div>' +
        '<div class="field"><span class="lbl">¿Necesitas ideas?</span><div class="ideas" id="ideas"></div></div>' +
        '<div class="field"><span class="lbl">Así queda tu tarjeta</span>' +
        '<div class="card-prev" aria-live="polite"><div class="lab" id="card-lab"></div><div class="msg" id="card-msg"></div>' +
        '<div class="ft"><span>@MUJERESDELUZ__</span><span class="mark"></span></div></div>' +
        '<p class="sorpresa">Tu mensaje del universo va aparte y es sorpresa: cada caja trae uno distinto.</p></div>' +
        '<div class="summary">' + priceHtml() + '<span class="eyebrow">Velita de masaje + ritual</span></div>' +
        '<div class="final"><a class="btn" id="wa-order" href="#" target="_blank" rel="noopener">' + WA + 'Pedir por WhatsApp</a>' +
        '<p class="note">Pagas por Nequi o Bre-B en el mismo chat. En Bogotá, tu pedido llega al día siguiente.</p></div>' +
      '</div>' +
      '<div style="margin-top:22px;text-align:center"><button class="link" id="redo">Repetir el test</button></div>' +
      '</div>'
    );
    wireForm();
    app.querySelectorAll("[data-swap]").forEach(function (b) {
      b.addEventListener("click", function () { st.ritual = b.getAttribute("data-swap"); renderResult(); });
    });
    document.getElementById("redo").addEventListener("click", function () { st.q = 0; st.answers = []; st.ritual = null; st.mode = "mi"; renderQuestion(); window.scrollTo(0, 0); });
  }

  function wireForm() {
    var r = RITUALS[st.ritual];
    var nameI = document.getElementById("f-name"), toI = document.getElementById("f-to"), msgI = document.getElementById("f-msg");
    nameI.value = st.name; toI.value = st.to; msgI.value = st.msg;

    function refreshMode() {
      var c = MODE_COPY[st.mode];
      document.getElementById("lab-msg").textContent = c.lab;
      msgI.placeholder = c.ph;
      document.getElementById("row-to").hidden = st.mode === "mi";
      var ideas = (st.mode === "mi" ? r.ideas : r.ideasGift);
      document.getElementById("ideas").innerHTML = ideas.map(function (t, i) { return '<button type="button" class="chip" data-idea="' + i + '">' + esc(t) + '</button>'; }).join("");
      document.querySelectorAll("[data-idea]").forEach(function (b) {
        b.addEventListener("click", function () { msgI.value = ideas[+b.getAttribute("data-idea")]; sync(); });
      });
      document.querySelectorAll("#seg .chip").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-mode") === st.mode)); });
    }
    function cardLabel() {
      var base = MODE_COPY[st.mode].card;
      if (st.mode === "regalo" && st.to.trim()) base = "Para " + st.to.trim();
      return base;
    }
    function orderText() {
      var lines = [
        "Hola, Mujeres de Luz. Quiero mi ritual:",
        "Ritual: " + r.name + " (" + r.el + ")",
        "Velita de masaje: " + money(PRICE) + " + envío (promoción, precio normal " + money(PRICE_REG) + ")",
        "Es: " + MODE_NAMES[st.mode].toLowerCase()
      ];
      if (st.mode !== "mi" && st.to.trim()) lines.push("Para: " + st.to.trim());
      if (st.msg.trim()) lines.push((st.mode === "mi" ? "Mi intención en la tarjeta: " : "Mensaje en la tarjeta: ") + "\"" + st.msg.trim() + "\"");
      lines.push("Mi nombre: " + (st.name.trim() || "—"));
      lines.push("Pago por Nequi o Bre-B. Entrega en Bogotá.");
      return lines.join("\n");
    }
    function sync() {
      st.name = nameI.value; st.to = toI.value; st.msg = msgI.value;
      document.getElementById("count").textContent = msgI.value.length + " / 120";
      document.getElementById("card-lab").innerHTML = STAR + esc(cardLabel());
      var m = document.getElementById("card-msg");
      if (st.msg.trim()) { m.textContent = st.msg.trim(); m.classList.remove("ph"); }
      else { m.textContent = r.ideas[0]; m.classList.add("ph"); }
      document.getElementById("wa-order").href = waHref(orderText());
    }
    [nameI, toI, msgI].forEach(function (el) { el.addEventListener("input", sync); });
    document.querySelectorAll("#seg .chip").forEach(function (b) {
      b.addEventListener("click", function () { st.mode = b.getAttribute("data-mode"); refreshMode(); sync(); });
    });
    document.getElementById("wa-order").addEventListener("click", function (e) {
      if (!nameI.value.trim()) {
        e.preventDefault();
        document.getElementById("err-name").hidden = false;
        nameI.focus();
      }
    });
    refreshMode(); sync();
  }

  /* ====== MEDITACIÓN (destino del QR de cada caja) ====== */
  function pickFrase(k) {
    var list = FRASES[k], last = -1, key = "mdl-last-" + k;
    try { last = parseInt(localStorage.getItem(key), 10); } catch (e) {}
    var i = Math.floor(Math.random() * list.length);
    if (list.length > 1 && i === last) i = (i + 1 + Math.floor(Math.random() * (list.length - 1))) % list.length;
    try { localStorage.setItem(key, String(i)); } catch (e) {}
    return list[i];
  }
  function meditation(k) {
    var r = RITUALS[k];
    document.body.classList.remove("is-landing");
    var audio = MEDITATION_URL[k]
      ? '<a class="btn" href="' + MEDITATION_URL[k] + '" target="_blank" rel="noopener">Escuchar mi meditación</a>'
      : '<p class="soon">Tu meditación guiada llega muy pronto.</p>';
    app.innerHTML = previewBar() + header(true) +
      '<main class="test"><div class="res med r-' + k + '">' +
      '<div class="orb-lg">' + ICONS[k] + '</div>' +
      '<div class="eyebrow">Tu momento · ' + r.name + '</div>' +
      '<h1>Tu mensaje del universo</h1>' +
      '<div class="frase" aria-live="polite"><div class="lab">' + STAR + 'Para ti, hoy</div><p id="frase-txt"></p>' +
      '<div class="ft"><span>@MUJERESDELUZ__</span><span class="mark"></span></div></div>' +
      '<div class="med-actions"><button class="btn ghost" id="otra">Otra frase</button>' + audio + '</div>' +
      '<p class="sorpresa" style="margin-top:14px">Toma una captura y súbela a tu historia etiquetando ' + INSTAGRAM + '. Nos encanta verte brillar.</p>' +
      '<div class="inside-t">Tu ritual</div>' +
      '<ol class="ritual-steps">' + r.inside.map(function (s, i) { return '<li><i>' + (i + 1) + '</i><span>' + s + '</span></li>'; }).join("") + '</ol>' +
      '<div class="cta-row"><a class="btn" href="#test">Descubre tu ritual</a>' +
      '<a class="btn ghost" href="' + waHref("Hola, Mujeres de Luz. Abrí mi vela y quiero pedir otra.") + '" target="_blank" rel="noopener">' + WA + 'Escríbenos</a></div>' +
      '</div></main>';
    var t = document.getElementById("frase-txt");
    t.textContent = pickFrase(k);
    document.getElementById("otra").addEventListener("click", function () { t.textContent = pickFrase(k); });
  }

  /* ====== RUTA ====== */
  function route() {
    var h = (location.hash || "").replace("#", "");
    if (h === "test") {
      if (st.q >= QUESTIONS.length && st.ritual) renderResult(); else { st.q = Math.min(st.q, QUESTIONS.length - 1); renderQuestion(); }
    } else if (FRASES[h]) { meditation(h); }
    else { landing(); }
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
